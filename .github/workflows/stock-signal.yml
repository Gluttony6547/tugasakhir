name: Stock Signal Dashboard

on:
  push:
    branches: [main]
    paths:
      - "Prog3/**"
      - ".github/workflows/stock-signal.yml"
  pull_request:
    paths:
      - "Prog3/**"
      - ".github/workflows/stock-signal.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prog3
    env:
      DATABASE_URL: sqlite://
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Prog3/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q test_suite.py

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag stock-signal-dashboard:ci ./Prog3

  deploy:
    runs-on: ubuntu-latest
    needs: [test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deployment when configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not configured; deployment skipped."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
